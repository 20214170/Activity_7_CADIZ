
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadiz Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #cbd9d1;
            color: #3b443f;
        }

        
        header {
            background-color: #626262;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 22px;
            font-weight: bold;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .logo img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        
        nav {
            background-color: #504e4e;
            text-align: center;
            padding: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin: 0 18px;
            font-size: 14px;
        }

        nav a:hover,
        nav a.active {
            color: #e9bd58;
        }

        
        .gallery-container {
            max-width: 750px;
            min-height: 750px;
            margin: 40px auto 25px;
            padding: 42px 30px;
            background-color: #d2dfd7;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            font-size: 25px;
            margin: 0 0 10px;
            font-weight: 800;
        }

        .subtitle {
            color: #6b7770;
            font-size: 14px;
            font-style: italic;
            margin-bottom: 65px;
        }

        /* Gallery grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px 25px;
            max-width: 590px;
            margin: 0 auto;
        }

        .gallery-item {
            text-align: center;
        }

        .gallery-item img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #d7b54d;
            object-fit: cover;
            display: block;
            margin: 0 auto 8px;
        }

        .gallery-item p {
            margin: 0;
            font-size: 14px;
            color: #4c514e;
        }

        
        @media (max-width: 600px) {
            .gallery-container {
                margin: 20px 12px;
                padding: 30px 15px;
                min-height: auto;
            }

            nav a {
                margin: 0 7px;
                font-size: 12px;
            }

            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }

            .subtitle {
                margin-bottom: 35px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            <img src="CADIZ.png " alt="Cadiz Logo">

        </div>

    <nav>
